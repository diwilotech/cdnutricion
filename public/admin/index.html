<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio · CD Nutrición</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/admin/assets/app.css" rel="stylesheet">
</head>
<body>
  <main class="container-xl py-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
      <div>
        <h1 class="page-title" id="greeting">Inicio</h1>
        <div class="text-body-secondary small" id="todayLabel"></div>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-primary" href="/admin/citas?new=1"><i class="bi bi-calendar-plus me-1"></i>Agendar cita</a>
        <a class="btn btn-primary" href="/admin/pacientes?new=1"><i class="bi bi-person-plus me-1"></i>Nuevo paciente</a>
      </div>
    </div>

    <div class="row g-3 mb-4" id="kpis">
      <div class="col-6 col-lg-3"><div class="card kpi placeholder-glow"><span class="placeholder col-8"></span><span class="placeholder col-4 mt-2" style="height:2rem"></span></div></div>
      <div class="col-6 col-lg-3"><div class="card kpi placeholder-glow"><span class="placeholder col-8"></span><span class="placeholder col-4 mt-2" style="height:2rem"></span></div></div>
      <div class="col-6 col-lg-3"><div class="card kpi placeholder-glow"><span class="placeholder col-8"></span><span class="placeholder col-4 mt-2" style="height:2rem"></span></div></div>
      <div class="col-6 col-lg-3"><div class="card kpi placeholder-glow"><span class="placeholder col-8"></span><span class="placeholder col-4 mt-2" style="height:2rem"></span></div></div>
    </div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card h-100">
          <div class="card-header d-flex justify-content-between align-items-center py-3">
            <span><i class="bi bi-clock me-2"></i>Agenda de hoy</span>
            <a href="/admin/citas" class="small">Ver agenda</a>
          </div>
          <div class="list-group list-group-flush" id="todayList"></div>
        </div>
      </div>
      <div class="col-lg-5 d-flex flex-column gap-3">
        <div class="card">
          <div class="card-header py-3"><i class="bi bi-calendar-week me-2"></i>Próximos 7 días</div>
          <div class="list-group list-group-flush" id="upcomingList"></div>
        </div>
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center py-3">
            <span><i class="bi bi-person-plus me-2"></i>Pacientes recientes</span>
            <a href="/admin/pacientes" class="small">Ver todos</a>
          </div>
          <div class="list-group list-group-flush" id="recentList"></div>
        </div>
      </div>
    </div>

    <div id="tablero" class="mt-4"></div>
    <div class="card mt-3 p-3 d-flex flex-row flex-wrap gap-2 align-items-center">
      <b class="me-auto small text-uppercase text-body-secondary">Descargar</b>
      <button class="btn btn-sm btn-outline-secondary" data-csv="pacientes"><i class="bi bi-download me-1"></i>Pacientes</button>
      <button class="btn btn-sm btn-outline-secondary" data-csv="consultas"><i class="bi bi-download me-1"></i>Consultas</button>
      <button class="btn btn-sm btn-outline-secondary" data-csv="citas"><i class="bi bi-download me-1"></i>Citas</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/admin/assets/app.js"></script>
  <script src="/admin/assets/dwviz.js"></script>
  <script>
    (async () => {
      const me = await App.init('inicio');
      if (!me) return;
      const { esc } = App;
      const $ = (id) => document.getElementById(id);

      const h = new Date().getHours();
      const hello = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
      $('greeting').textContent = `${hello}${me.name ? ', ' + me.name.split(' ')[0] : ''}`;

      let d;
      try {
        d = await App.api('/dashboard');
      } catch (err) {
        App.fail(err);
        return;
      }
      $('todayLabel').textContent = `${me.session.businessName} · ${App.fmtDate(d.today, { weekday: true })}`;

      const k = d.kpis;
      const p = d.progress || {};
      const cards = [
        ['bi-people', 'Pacientes activos', k.active_patients, `+${k.new_patients_month} este mes`],
        ['bi-calendar-check', 'Citas hoy', k.appts_today, `${k.appts_week} en los próximos 7 días`],
        ['bi-clipboard2-pulse', 'Consultas del mes', k.consultations_month, k.no_show_month ? `${k.no_show_month} inasistencias` : 'Sin inasistencias'],
        ['bi-graph-down-arrow', 'Peso perdido (total)', p.kg_total ? `${App.fmtNum(p.kg_total)} kg` : '—',
          p.tracked ? `${p.improving} de ${p.tracked} pacientes bajando` : 'Requiere 2+ consultas'],
      ];
      $('kpis').innerHTML = cards.map(([icon, label, value, sub]) => `
        <div class="col-6 col-lg-3"><div class="card kpi h-100">
          <div class="d-flex justify-content-between align-items-start">
            <div class="kpi-label">${label}</div><i class="bi ${icon} kpi-icon"></i>
          </div>
          <div class="kpi-value mt-1">${esc(value)}</div>
          <div class="small text-body-secondary mt-1">${esc(sub)}</div>
        </div></div>`).join('');

      const emptyRow = (msg) => `<div class="empty small">${msg}</div>`;
      const personRow = (x, right, href) => `
        <a class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-2" href="${href}">
          <span class="avatar">${esc(App.initials(x))}</span>
          <span class="flex-grow-1 text-truncate">${esc(App.fullName(x))}</span>${right}</a>`;

      $('todayList').innerHTML = d.todayAppointments.length
        ? d.todayAppointments.map((a) => `
            <a class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3" href="/admin/cuerpo?id=${esc(a.patient_id)}">
              <span class="appt-time">${App.fmtTime(a.starts_at)}</span>
              <span class="avatar">${esc(App.initials(a))}</span>
              <span class="flex-grow-1">
                <span class="d-block fw-medium">${esc(App.fullName(a))}</span>
                <span class="small text-body-secondary">${App.KIND[a.kind]} · ${a.duration_min} min</span>
              </span>
              ${App.statusBadge(a.status)}
            </a>`).join('')
        : emptyRow('<i class="bi bi-cup-hot d-block fs-3 mb-1"></i>No hay citas para hoy');

      $('upcomingList').innerHTML = d.upcoming.length
        ? d.upcoming.map((a) => personRow(a, `<span class="small text-body-secondary text-nowrap">${App.fmtDate(a.starts_at, { weekday: true }).split(' ').slice(0, 3).join(' ')} · ${App.fmtTime(a.starts_at)}</span>`, `/admin/cuerpo?id=${esc(a.patient_id)}`)).join('')
        : emptyRow('Sin citas programadas');

      $('recentList').innerHTML = d.recentPatients.length
        ? d.recentPatients.map((x) => personRow(x, `<span class="small text-body-secondary">${App.fmtDate(x.created_at)}</span>`, `/admin/cuerpo?id=${esc(x.id)}`)).join('')
        : emptyRow('Aún no hay pacientes');

      // ---- Tablero con el kit común (dwviz): crecimiento, asistencia, pacientes que no vuelven y embudo de citas ----
      document.querySelectorAll('[data-csv]').forEach((b) => (b.onclick = async () => {
        const r = await fetch(`/api/admin/export/${b.dataset.csv}`, { credentials: 'same-origin', headers: { 'x-cdn': '1', ...(App.slug ? { 'x-business': App.slug } : {}) } });
        if (!r.ok) { App.toast('No se pudo descargar', false); return; }
        const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = `${b.dataset.csv}.csv`; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }));
      (async () => {
        const V = window.DwViz, host = $('tablero'); if (!V) return;
        let t; try { t = await App.api('/tablero'); } catch { return; }
        const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        host.innerHTML = '<div class="dv-g"><div data-a></div><div data-b></div></div><div class="dv-g mt-3"><div data-c></div><div data-d></div></div><div class="mt-3" data-e></div>';
        const box = (id, titulo, sub) => { const h = host.querySelector(`[data-${id}]`); h.innerHTML = V.tarjeta(titulo, '<div data-in></div>', { sub }); return h.querySelector('[data-in]'); };
        V.barras(box('a', 'Consultas y pacientes nuevos', 'Últimos 6 meses'), { etiquetas: t.meses.map((m) => MES[+m.mes.slice(5) - 1]), series: [{ nombre: 'Consultas', datos: t.meses.map((m) => m.consultas) }, { nombre: 'Pacientes nuevos', datos: t.meses.map((m) => m.nuevos), color: '#34D399' }] });
        const NOM = { done: 'Atendidas', scheduled: 'Programadas', cancelled: 'Canceladas', no_show: 'No asistió' };
        const dona = box('b', 'Citas de los últimos 30 días', t.asistencia == null ? 'Aún sin citas atendidas' : `Asistencia ${t.asistencia} %`);
        const lista = Object.entries(t.estados).map(([k, n]) => ({ nombre: NOM[k] || k, valor: n }));
        if (lista.length) V.dona(dona, lista, { centro: 'Citas' }); else V.vacio(dona, { icono: 'bi-calendar-check', titulo: 'Sin citas recientes', texto: 'Agenda citas y verás aquí cómo van.' });
        const sv = box('c', 'Llevan tiempo sin volver', 'Más de 60 días desde su última consulta');
        sv.innerHTML = t.sin_volver.length ? t.sin_volver.map((x) => `<a class="d-flex gap-2 py-2 border-bottom text-decoration-none text-reset" href="${App.base}/cuerpo?id=${esc(x.id)}"><span class="avatar">${esc(App.initials(x))}</span><span class="flex-grow-1 text-truncate"><b>${esc(App.fullName(x))}</b><span class="d-block small text-body-secondary">${x.ultima ? 'Última consulta ' + App.fmtDate(x.ultima) : 'Aún sin consulta'}</span></span>${x.phone ? `<span class="small text-body-secondary">${esc(x.phone)}</span>` : ''}</a>`).join('') : '<div class="small text-body-secondary p-2">Todos tus pacientes activos han vuelto en los últimos 60 días.</div>';
        const av = box('d', 'Quiénes más han avanzado', 'Kilos menos desde la primera consulta');
        if (t.avance.length) V.ranking(av, t.avance.map((x) => ({ nombre: App.fullName(x), valor: x.kg })), { fmt: (v) => `${App.fmtNum(v)} kg` }); else V.vacio(av, { icono: 'bi-graph-down-arrow', titulo: 'Todavía sin evolución', texto: 'Se calcula con 2 o más consultas con peso.' });
        // Embudo de citas
        const { items, today } = await App.api('/embudo');
        const COLS = [['scheduled', 'Programadas', '#60A5FA'], ['done', 'Atendidas', '#34D399'], ['no_show', 'No asistió', '#FBBF24'], ['cancelled', 'Canceladas', '#F87171']];
        const kb = box('e', 'Embudo de citas', 'De hace 7 días a 14 adelante · arrastra para cambiar el estado');
        const pintar = () => V.kanban(kb, {
          columnas: COLS.map(([id, titulo, color]) => ({ id, titulo, color, items: items.filter((a) => a.status === id).map((a) => ({ id: a.id, titulo: App.fullName(a), detalle: `${a.starts_at.slice(0, 10) === today ? 'hoy' : App.fmtDate(a.starts_at)} ${App.fmtTime(a.starts_at)} · ${App.KIND[a.kind] || a.kind}` })) })),
          mover: async (id, desde, hasta) => {
            try { await App.api(`/appointments/${id}/status`, { method: 'POST', body: { status: hasta } }); items.find((a) => a.id === id).status = hasta; App.toast('Cita actualizada'); pintar(); } catch (err) { App.fail(err); }
          } });
        pintar();
      })().catch(() => {});
    })();
  </script>
</body>
</html>
