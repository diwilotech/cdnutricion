<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ajustes · CD Nutrición</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/admin/assets/app.css" rel="stylesheet">
</head>
<body>
  <main class="container-xl py-4">
    <h1 class="page-title mb-3">Ajustes</h1>
    <div class="row g-3">
      <div class="col-lg-6">
        <div class="card">
          <div class="card-header py-3"><i class="bi bi-shop me-2"></i>Datos del negocio</div>
          <form class="card-body" id="businessForm" novalidate>
            <fieldset id="businessFields">
              <div class="mb-3"><label class="form-label">Nombre *</label><input name="name" class="form-control" required maxlength="120"></div>
              <div class="row g-3 mb-3">
                <div class="col-sm-6"><label class="form-label">Correo</label><input name="email" type="email" class="form-control"></div>
                <div class="col-sm-6"><label class="form-label">Teléfono</label><input name="phone" class="form-control" maxlength="30"></div>
              </div>
              <div class="mb-3"><label class="form-label">Zona horaria</label>
                <select name="timezone" class="form-select">
                  <option>America/Bogota</option><option>America/Mexico_City</option><option>America/Lima</option>
                  <option>America/Guayaquil</option><option>America/Caracas</option><option>America/Santiago</option>
                  <option>America/Argentina/Buenos_Aires</option><option>America/Panama</option><option>Europe/Madrid</option>
                </select></div>
              <div class="mb-3"><label class="form-label">Instancia de WhatsApp (Evolution API)</label>
                <input name="wa_instance" class="form-control" maxlength="80" placeholder="nombre-de-la-instancia">
                <div class="form-text">Nombre de la instancia conectada al número de WhatsApp del negocio.</div></div>
              <button type="submit" class="btn btn-primary">Guardar</button>
            </fieldset>
          </form>
        </div>

        <div class="card mt-3">
          <div class="card-header py-3"><i class="bi bi-plug me-2"></i>Integraciones</div>
          <div class="card-body" id="integrations"></div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card">
          <div class="card-header py-3"><i class="bi bi-people me-2"></i>Equipo</div>
          <div class="list-group list-group-flush" id="team"></div>
          <form class="card-body border-top" id="teamForm" novalidate>
            <div class="small fw-semibold mb-2">Agregar miembro</div>
            <div class="row g-2">
              <div class="col-sm-5"><input name="email" type="email" class="form-control" placeholder="correo@ejemplo.com" required></div>
              <div class="col-sm-4"><input name="name" class="form-control" placeholder="Nombre" maxlength="100"></div>
              <div class="col-sm-3"><select name="role" class="form-select">
                <option value="staff">Equipo</option><option value="admin">Administrador</option><option value="owner">Propietario</option></select></div>
            </div>
            <div class="form-text mb-2">Si la persona aún no tiene cuenta, se genera un link para que cree su contraseña.</div>
            <button type="submit" class="btn btn-outline-primary btn-sm"><i class="bi bi-person-plus me-1"></i>Agregar</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/admin/assets/app.js"></script>
  <script>
    (async () => {
      const me = await App.init('ajustes');
      if (!me) return;
      const { esc } = App;
      const $ = (id) => document.getElementById(id);
      const canManage = ['owner', 'admin'].includes(me.session.role);
      if (!canManage) {
        $('businessFields').disabled = true;
        $('teamForm').classList.add('d-none');
      }

      async function loadBusiness() {
        const d = await App.api('/business');
        App.fillForm($('businessForm'), d.business);
        const row = (ok, icon, title, desc, action) => `
          <div class="d-flex align-items-start gap-3 mb-3">
            <i class="bi ${icon} fs-4 ${ok ? 'text-success' : 'text-body-secondary'}"></i>
            <div class="flex-grow-1"><div class="fw-medium">${title}
              <span class="badge ${ok ? 'text-bg-success' : 'text-bg-secondary'} ms-1">${ok ? 'Configurado' : 'Sin configurar'}</span></div>
              <div class="small text-body-secondary">${desc}</div>
              ${ok && canManage ? action : ''}</div>
          </div>`;
        $('integrations').innerHTML =
          row(d.integrations.whatsapp && !!d.business.wa_instance, 'bi-whatsapp', 'WhatsApp',
            'Recordatorios de citas vía Evolution API.',
            `<form class="input-group input-group-sm mt-2" id="waTest" style="max-width:20rem">
               <input name="phone" class="form-control" placeholder="Número de prueba" required>
               <button class="btn btn-outline-secondary" type="submit">Probar</button></form>`) +
          row(d.integrations.email, 'bi-envelope', 'Correo (Gmail SMTP)',
            'Envío de correos a pacientes.',
            `<form class="input-group input-group-sm mt-2" id="mailTest" style="max-width:20rem">
               <input name="to" type="email" class="form-control" placeholder="correo de prueba" required>
               <button class="btn btn-outline-secondary" type="submit">Probar</button></form>`);
        if ($('waTest')) App.onSubmit($('waTest'), async (f) => {
          await App.api('/integrations/whatsapp/test', { method: 'POST', body: f });
          App.toast('Mensaje de prueba enviado');
        });
        if ($('mailTest')) App.onSubmit($('mailTest'), async (f) => {
          await App.api('/integrations/email/test', { method: 'POST', body: f });
          App.toast('Correo de prueba enviado');
        });
      }

      async function loadTeam() {
        const { items } = await App.api('/team');
        $('team').innerHTML = items.map((u) => `
          <div class="list-group-item d-flex align-items-center gap-3">
            <span class="avatar">${esc((u.name || u.email)[0].toUpperCase())}</span>
            <div class="flex-grow-1 text-truncate">
              <div class="fw-medium text-truncate">${esc(u.name || u.email)}</div>
              <div class="small text-body-secondary text-truncate">${esc(u.email)}${u.has_password ? '' : ' · <em>invitación pendiente</em>'}</div>
            </div>
            <span class="badge text-bg-light">${App.ROLE[u.role]}</span>
            ${canManage && u.id !== me.userId ? `
              <div class="dropdown">
                <button class="btn btn-sm btn-link text-body-secondary" data-bs-toggle="dropdown" aria-label="Opciones"><i class="bi bi-three-dots-vertical"></i></button>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li><button class="dropdown-item" data-reset="${esc(u.id)}"><i class="bi bi-link-45deg me-2"></i>Link para crear contraseña</button></li>
                  <li><button class="dropdown-item text-danger" data-remove="${esc(u.id)}"><i class="bi bi-person-dash me-2"></i>Quitar del equipo</button></li>
                </ul>
              </div>` : ''}
          </div>`).join('') || '<div class="empty small">Sin miembros</div>';
      }

      App.onSubmit($('businessForm'), async (d) => {
        await App.api('/business', { method: 'PUT', body: d });
        App.toast('Datos guardados');
        loadBusiness();
      });

      App.onSubmit($('teamForm'), async (d) => {
        const r = await App.api('/team', { method: 'POST', body: d });
        $('teamForm').reset();
        App.toast('Miembro agregado');
        if (r.inviteUrl) App.inviteDialog(r.inviteUrl, 'Invitación al equipo');
        loadTeam();
      });

      $('team').addEventListener('click', async (ev) => {
        const b = ev.target.closest('button[data-reset],button[data-remove]');
        if (!b) return;
        try {
          if (b.dataset.reset) {
            const r = await App.api(`/team/${b.dataset.reset}/invite`, { method: 'POST' });
            App.inviteDialog(r.inviteUrl);
            return;
          } else {
            if (!(await App.confirmAction('¿Quitar a esta persona del equipo?'))) return;
            await App.api(`/team/${b.dataset.remove}`, { method: 'DELETE' });
            App.toast('Miembro eliminado');
          }
          loadTeam();
        } catch (err) { App.fail(err); }
      });

      try {
        await Promise.all([loadBusiness(), loadTeam()]);
      } catch (err) { App.fail(err); }
    })();
  </script>
</body>
</html>
