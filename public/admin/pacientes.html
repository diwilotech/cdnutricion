<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pacientes · CD Nutrición</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/admin/assets/app.css" rel="stylesheet">
</head>
<body>
  <main class="container-xl py-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
      <h1 class="page-title">Pacientes <span class="text-body-secondary fw-normal fs-6" id="count"></span></h1>
      <button class="btn btn-primary" id="newBtn"><i class="bi bi-person-plus me-1"></i>Nuevo paciente</button>
    </div>

    <div class="card">
      <div class="card-body d-flex flex-wrap gap-2 border-bottom">
        <div class="input-group flex-grow-1" style="max-width:28rem">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="search" id="q" class="form-control" placeholder="Nombre, documento o teléfono">
        </div>
        <select id="status" class="form-select w-auto">
          <option value="active">Activos</option>
          <option value="archived">Archivados</option>
        </select>
      </div>
      <div class="table-responsive">
        <table class="table table-hover table-clickable mb-0">
          <thead class="small text-body-secondary">
            <tr><th>Paciente</th><th class="hide-xs">Teléfono</th><th class="num hide-xs">Último peso</th><th class="hide-xs">Última consulta</th><th>Próxima cita</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="card-footer bg-transparent d-flex justify-content-between align-items-center" id="pager"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/admin/assets/app.js"></script>
  <script src="/admin/assets/forms.js"></script>
  <script>
    (async () => {
      if (!(await App.init('pacientes'))) return;
      const { esc } = App;
      const $ = (id) => document.getElementById(id);
      let page = 1;
      let timer;

      async function load() {
        const qs = new URLSearchParams({ q: $('q').value.trim(), status: $('status').value, page });
        try {
          const d = await App.api(`/patients?${qs}`);
          $('count').textContent = `(${d.total})`;
          $('rows').innerHTML = d.items.length
            ? d.items.map((p) => `
                <tr data-id="${esc(p.id)}">
                  <td><div class="d-flex align-items-center gap-2">
                    <span class="avatar">${esc(App.initials(p))}</span>
                    <div><div class="fw-medium">${esc(App.fullName(p))}</div>
                    <div class="small text-body-secondary">${[p.doc_id, App.age(p.birth_date) !== null ? App.age(p.birth_date) + ' años' : ''].filter(Boolean).map(esc).join(' · ')}</div></div>
                  </div></td>
                  <td class="hide-xs">${esc(p.phone || '—')}</td>
                  <td class="num hide-xs">${p.last_weight ? App.fmtNum(p.last_weight) + ' kg' : '—'}</td>
                  <td class="hide-xs">${App.fmtDate(p.last_visit)}</td>
                  <td>${p.next_appt ? `<span class="text-nowrap">${App.fmtDateTime(p.next_appt)}</span>` : '<span class="text-body-secondary">—</span>'}</td>
                </tr>`).join('')
            : `<tr><td colspan="5" class="empty">${$('q').value ? 'Sin resultados' : 'Aún no hay pacientes. Crea el primero.'}</td></tr>`;

          const pages = Math.max(1, Math.ceil(d.total / d.pageSize));
          $('pager').innerHTML = `<span class="small text-body-secondary">Página ${d.page} de ${pages}</span>
            <div class="btn-group btn-group-sm">
              <button class="btn btn-outline-secondary" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''}><i class="bi bi-chevron-left"></i></button>
              <button class="btn btn-outline-secondary" data-page="${page + 1}" ${page >= pages ? 'disabled' : ''}><i class="bi bi-chevron-right"></i></button>
            </div>`;
        } catch (err) { App.fail(err); }
      }

      $('rows').addEventListener('click', (ev) => {
        const tr = ev.target.closest('tr[data-id]');
        if (tr) location.href = `/admin/cuerpo?id=${tr.dataset.id}`;
      });
      $('pager').addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-page]');
        if (b) { page = +b.dataset.page; load(); }
      });
      $('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { page = 1; load(); }, 250); });
      $('status').addEventListener('change', () => { page = 1; load(); });

      const openNew = () => Forms.patientDialog(null, (id) => (location.href = `/admin/cuerpo?id=${id}`));
      $('newBtn').addEventListener('click', openNew);
      if (App.param('new')) openNew();

      load();
    })();
  </script>
</body>
</html>
