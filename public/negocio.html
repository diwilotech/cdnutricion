<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- El Worker completa título, descripción, imagen y manifiesto de cada consultorio (HTMLRewriter). -->
  <title>Consultorio de nutrición</title>
  <meta name="description" content="Seguimiento nutricional personalizado">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Consultorio de nutrición">
  <meta property="og:description" content="Seguimiento nutricional personalizado">
  <meta property="og:image" content="/cv/icon-512.png">
  <meta property="og:url" content="">
  <meta name="theme-color" content="#1388A5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Consultorio">
  <link rel="manifest" href="">
  <link rel="apple-touch-icon" href="/cv/icon-180.png">
  <link rel="icon" type="image/png" href="/cv/icon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/admin/assets/app.css" rel="stylesheet">
  <link href="/cv/card.css" rel="stylesheet">
  <script>
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const theme = () => document.documentElement.setAttribute('data-bs-theme', mq.matches ? 'dark' : 'light');
    theme(); mq.addEventListener('change', theme);
  </script>
</head>
<body>
  <main class="container py-4 cdn-enter" id="card">
    <div class="text-center py-5"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando…</span></div></div>
  </main>
  <script src="/cv/card.js"></script>
  <script>
    (async () => {
      // /<consultorio> o /<consultorio>/<profesional>
      const [slug, handle] = location.pathname.split('/').filter(Boolean);
      const base = handle ? `/${slug}/${handle}` : `/${slug}`;
      const box = document.getElementById('card');
      try {
        const r = await fetch(`/api/public/negocio/${encodeURIComponent(slug)}${handle ? '/' + encodeURIComponent(handle) : ''}`);
        if (!r.ok) throw new Error();
        CardView.render(box, await r.json(), { slug });
      } catch {
        box.innerHTML = '<p class="text-center text-body-secondary py-5">No pudimos cargar la tarjeta. Intenta de nuevo.</p>';
      }
      // Instalable: el service worker guarda la tarjeta para abrirla sin conexión.
      if ('serviceWorker' in navigator) navigator.serviceWorker.register(`${base}/sw.js`, { scope: base }).catch(() => {});
    })();
  </script>
</body>
</html>
